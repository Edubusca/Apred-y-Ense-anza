<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test interactivo — Aprendizaje y Enseñanza</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#65727e;--border:#d8dee4;--accent:#1769aa;--good:#18794e;--bad:#b42318;--soft:#eef4f8}
body.dark{--bg:#101418;--card:#192027;--text:#edf2f7;--muted:#aab6c2;--border:#34404b;--accent:#6cb6ff;--good:#63d49a;--bad:#ff8a80;--soft:#222c35}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border);padding:14px 18px}
.top{max-width:1100px;margin:auto}.title{font-size:1.25rem;font-weight:750;margin-bottom:10px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,button{font:inherit;border:1px solid var(--border);border-radius:8px;padding:9px 11px;background:var(--card);color:var(--text)}
button{cursor:pointer;font-weight:650} button.primary{background:var(--accent);color:white;border-color:var(--accent)}
button:hover{filter:brightness(.97)} .count{color:var(--muted);font-size:.92rem;margin-top:9px}
main{max-width:1100px;margin:18px auto;padding:0 14px 40px}.question{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin:12px 0}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.86rem;margin-bottom:8px}.qtext{font-weight:700;line-height:1.4;margin-bottom:10px}
.option{display:flex;gap:9px;align-items:flex-start;padding:8px;border-radius:8px;margin:4px 0}.option:hover{background:var(--soft)} .option input{margin-top:3px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.feedback{font-weight:700}.good{color:var(--good)}.bad{color:var(--bad)}
.correctOpt{outline:2px solid var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.wrongOpt{outline:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.summary{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:650}
@media(max-width:650px){header{position:static}.controls>*{flex:1 1 140px}.title{font-size:1.08rem}.question{padding:13px}}
</style>
</head>
<body>
<header><div class="top">
  <div class="title">Test interactivo — Aprendizaje y Enseñanza de Economía y ADE</div>
  <div class="controls">
    <select id="theme"><option value="all">Todos los temas</option><option value="1">Tema 1</option><option value="2">Tema 2</option></select>
    <input id="search" type="search" placeholder="Buscar pregunta…">
    <button id="shuffle">Barajar respuestas</button>
    <button id="correctAll" class="primary">Corregir visibles</button>
    <button id="reset">Reiniciar</button>
    <button id="statsBtn">Estadísticas</button>
    <button id="dark">Modo oscuro</button>
  </div>
  <div class="count" id="count"></div>
  <div class="summary" id="summary" hidden></div>
</div></header>
<main id="quiz"></main>
<section id="statsPanel" style="max-width:1100px;margin:0 auto 40px;padding:0 14px" hidden>
  <div class="question">
    <div class="qtext">Estadísticas acumuladas</div>
    <div id="statsSummary" class="summary"></div>
    <div id="statsList" style="margin-top:12px"></div>
    <div class="actions">
      <button type="button" id="clearStats">Borrar estadísticas</button>
      <button type="button" id="closeStats">Cerrar estadísticas</button>
    </div>
  </div>
</section>
<script>
const QUESTIONS = [{"n": 1, "theme": 1, "page": 38, "q": "¿Qué tipo de evaluación se realiza antes de iniciar el proceso de enseñanza-aprendizaje?", "options": ["Evaluación sumativa", "Evaluación diagnóstica", "Evaluación continua", "Evaluación formativa"], "correct": 1}, {"n": 9, "theme": 1, "page": 41, "q": "¿Qué característica define a los portafolios como herramienta educativa?", "options": ["Limitar la creatividad del alumnado", "Restringir la autonomía en el aprendizaje", "Recopilar evidencias del proceso de aprendizaje progresivo", "Facilitar la memorización de contenidos"], "correct": 2}, {"n": 11, "theme": 1, "page": 16, "q": "¿Qué papel tiene el docente en el aprendizaje basado en proyectos?", "options": ["Guiar y coordinar el desarrollo del proyecto", "Observador sin implicación", "Proporcionar respuestas directas y solucionar conflictos del alumnado", "Asumir un rol pasivo"], "correct": 0}, {"n": 13, "theme": 1, "page": 16, "q": "¿Cuál es el objetivo principal del aprendizaje basado en proyectos (ABP)?", "options": ["Limitar la participación del alumnado", "Eliminar el trabajo en equipo", "Desarrollar competencias para resolver problemas reales", "Repetir conceptos teóricos"], "correct": 2}, {"n": 20, "theme": 1, "page": 38, "q": "¿Qué función tiene la evaluación continua?", "options": ["Acompañar y ajustar el proceso educativo en tiempo real", "Determinar solo el rendimiento al cierre del curso", "Medir la memorización de contenidos", "Emitir una única calificación final"], "correct": 0}, {"n": 21, "theme": 1, "page": 7, "q": "¿Cómo define el manual la economía?", "options": ["Como una ciencia exacta basada en números.", "Como una ciencia social que estudia la gestión de recursos.", "Como el estudio exclusivo de la bolsa de valores.", "Como una rama de la psicología del consumidor."], "correct": 1}, {"n": 22, "theme": 1, "page": 7, "q": "¿Cuál es el fin de toda actividad económica según el texto?", "options": ["La acumulación de metales preciosos.", "Cubrir unas necesidades mediante bienes o servicios.", "La regulación estricta del Estado.", "El ahorro sistemático de las familias."], "correct": 1}, {"n": 23, "theme": 1, "page": 7, "q": "¿Qué fases conforman la actividad económica antes del consumo?", "options": ["Producción, distribución y regulación.", "Marketing, venta y postventa.", "Inversión, ahorro y gasto.", "Importación y exportación únicamente."], "correct": 0}, {"n": 24, "theme": 1, "page": 7, "q": "¿Por qué se dice que los recursos son económicos?", "options": ["Porque son gratuitos para todos.", "Porque son recursos escasos y limitados.", "Porque siempre tienen un precio bajo.", "Porque pertenecen únicamente al Estado."], "correct": 1}, {"n": 25, "theme": 1, "page": 7, "q": "¿Cuáles son los dos pilares fundamentales de la economía mencionados?", "options": ["Oferta y demanda.", "Recursos escasos y eficiencia en su uso.", "Importaciones y exportaciones.", "Impuestos y gasto público."], "correct": 1}, {"n": 26, "theme": 1, "page": 7, "q": "¿Qué escala de la economía estudia los recursos a nivel del consumidor y las empresas?", "options": ["Macroeconomía.", "Microeconomía.", "Economía política.", "Economía circular."], "correct": 1}, {"n": 27, "theme": 1, "page": 7, "q": "¿Qué analiza la macroeconomía?", "options": ["La economía de una familia específica.", "La economía en su conjunto a gran escala.", "Únicamente el mercado del petróleo.", "El comportamiento del pequeño comercio."], "correct": 1}, {"n": 28, "theme": 1, "page": 8, "q": "Según Valero y Brunet (1999), ¿por qué es importante el estudio de la economía?", "options": ["Porque es una asignatura fácil de aprobar.", "Por la influencia de hechos económicos en la vida cotidiana.", "Para que todos los alumnos sean banqueros.", "Para eliminar la competencia entre empresas."], "correct": 1}, {"n": 29, "theme": 1, "page": 8, "q": "¿Qué efecto tiene un incremento de la inflación según el manual?", "options": ["Una bajada general de los precios.", "Un aumento de precios de artículos cotidianos.", "La creación de pleno empleo.", "Una mejora en la capacidad de ahorro."], "correct": 1}, {"n": 30, "theme": 1, "page": 8, "q": "¿Qué ventaja aporta el conocimiento económico a un trabajador?", "options": ["Le permite no pagar impuestos.", "Le ayuda a entender su nómina y asegurar sus derechos.", "Le garantiza un ascenso automático.", "Le permite trabajar menos horas."], "correct": 1}, {"n": 31, "theme": 1, "page": 9, "q": "¿Qué ley fue la base del sistema educativo en España durante más de cien años?", "options": ["La LOGSE.", "La Ley Moyano de 1857.", "La LOMCE.", "La LOE."], "correct": 1}, {"n": 32, "theme": 1, "page": 9, "q": "¿Qué ocurrió con la Economía en la Ley General de Educación de 1970?", "options": ["Se hizo obligatoria en toda la secundaria.", "Se eliminó de los planes y se incorporó a Geografía e Historia.", "Se creó una asignatura específica de 5 horas semanales.", "Se prohibió su enseñanza en colegios públicos."], "correct": 1}, {"n": 33, "theme": 1, "page": 9, "q": "¿Qué carácter le dio la LOGSE a la asignatura de Economía en 1990?", "options": ["De asignatura obligatoria en primaria.", "De asignatura independiente pero solo en Bachillerato.", "De materia transversal sin horas lectivas.", "Desapareció del currículo nacional."], "correct": 1}, {"n": 34, "theme": 1, "page": 9, "q": "¿Qué pretendía la LOMCE en 2013 respecto a la economía?", "options": ["Alejar la enseñanza del mundo empresarial.", "Acercar la enseñanza a la competitividad y al ámbito empresarial.", "Reducir el número de horas de economía.", "Fusionarla con la asignatura de Religión."], "correct": 1}, {"n": 35, "theme": 1, "page": 9, "q": "¿Qué supuso la LOMLOE (2020) para la materia de Economía?", "options": ["Un gran avance con muchas materias obligatorias.", "Un retroceso al mantener las materias como optativas.", "La eliminación total de la materia en Bachillerato.", "La obligatoriedad de la economía en 1º de ESO."], "correct": 1}, {"n": 36, "theme": 1, "page": 10, "q": "¿Qué define a una economía de libre mercado?", "options": ["El Gobierno controla todos los precios.", "Los mercados se autorregulan sin intervención del Gobierno.", "No existe la propiedad privada.", "Solo se permite el comercio de productos agrícolas."], "correct": 1}, {"n": 37, "theme": 1, "page": 10, "q": "¿Qué caracteriza a la economía planificada?", "options": ["El libre juego de la oferta y la demanda.", "El control total del Gobierno y ausencia de propiedad privada.", "La existencia de múltiples empresas competitivas.", "Que los precios cambian cada hora."], "correct": 1}, {"n": 38, "theme": 1, "page": 10, "q": "En economía, ¿qué es la \"utilidad\"?", "options": ["El precio de venta de un producto.", "La satisfacción que produce el consumo de bienes y servicios.", "El beneficio neto después de impuestos.", "La cantidad de stock en un almacén."], "correct": 1}, {"n": 39, "theme": 1, "page": 10, "q": "¿Cuáles son los factores productivos según el manual?", "options": ["Aire, fuego y agua.", "Tierra, capital y trabajo.", "Publicidad, marketing y ventas.", "Acciones, bonos y préstamos."], "correct": 1}, {"n": 40, "theme": 1, "page": 10, "q": "¿Qué son los bienes intangibles?", "options": ["Aquellos que se pueden tocar, como un coche.", "Los que cubren necesidades no materiales, como escuchar música.", "Los productos que están rotos.", "El dinero en efectivo."], "correct": 1}, {"n": 41, "theme": 1, "page": 12, "q": "¿En qué consiste la primera fase del aprendizaje basado en proyectos según De Miguel (2005)?", "options": ["En la planificación del procedimiento.", "En la recogida de información por diversas fuentes y selección de datos.", "En la realización experimental del proyecto.", "En la evaluación de los resultados obtenidos."], "correct": 1}, {"n": 42, "theme": 1, "page": 12, "q": "Según el método Philips 66, ¿cuánto tiempo tiene cada alumno para exponer?", "options": ["6 minutos.", "66 segundos.", "Un minuto.", "Cinco minutos."], "correct": 2}, {"n": 43, "theme": 1, "page": 14, "q": "¿Qué define a una \"Serie\" dentro de las formas de exponer casos reales?", "options": ["Un problema concreto resuelto por el alumno.", "Una secuencia de problemas asociados entre sí.", "Un caso donde no se identifica el problema inicialmente.", "Un caso donde solo se aporta una parte de la información."], "correct": 1}, {"n": 44, "theme": 1, "page": 14, "q": "¿Qué es el modelo \"Prototipo\" en el trabajo colaborativo?", "options": ["El profesor plantea un problema concreto que debe ser resuelto por el alumno.", "El alumno debe aportar modificaciones para reducir costes.", "Un caso basado en una empresa de fabricación de coches.", "La creación de un producto físico en el aula."], "correct": 0}, {"n": 45, "theme": 1, "page": 15, "q": "¿Cuál es el papel del docente en los \"juegos de empresas\"?", "options": ["Participar directamente en las negociaciones.", "Ser un mero observador de la situación que apenas interviene.", "Tomar todas las decisiones estratégicas.", "Corregir a los alumnos en tiempo real durante la actuación."], "correct": 1}, {"n": 46, "theme": 1, "page": 17, "q": "¿Por qué son receptivos a la información visual los alumnos en edades tempranas?", "options": ["Porque no saben leer todavía.", "Porque la información visual es más atractiva para ellos.", "Porque el manual prohíbe usar texto en primaria.", "Porque las imágenes siempre son reales y el texto no."], "correct": 1}, {"n": 47, "theme": 1, "page": 17, "q": "¿Qué precaución debe tener el profesor al usar medios de comunicación en clase?", "options": ["Que los periódicos no tengan manchas de tinta.", "La carga ideológica que puede tener el medio de comunicación.", "Que no se mencionen nombres de políticos.", "Solo usar prensa deportiva para no aburrir."], "correct": 1}, {"n": 48, "theme": 1, "page": 18, "q": "¿Qué programa se recomienda para que el alumno traduzca datos económicos a gráficos?", "options": ["Microsoft Word.", "Microsoft Excel.", "Adobe Photoshop.", "PowerPoint exclusivamente."], "correct": 1}, {"n": 49, "theme": 1, "page": 18, "q": "¿Cuál es un ejemplo de actividad con mapas económicos?", "options": ["Dibujar las fronteras de Europa.", "Comparar la evolución del IPC de diferentes países en los últimos 30 años.", "Localizar las capitales de provincia de España.", "Identificar los ríos más largos para el transporte."], "correct": 1}, {"n": 50, "theme": 1, "page": 18, "q": "¿Cuál es el primer paso antes de analizar una canción en clase?", "options": ["Comprar el disco original.", "Seguir un plan para acordar qué tipo de música sería adecuado.", "Bailar la canción para entrar en calor.", "Traducir la letra si está en inglés."], "correct": 1}, {"n": 51, "theme": 1, "page": 19, "q": "¿A qué actividad es semejante la investigación de marketing?", "options": ["Al dibujo artístico.", "Al estudio de artículos económicos en la prensa.", "A una excursión al mercado.", "A un examen final teórico."], "correct": 1}, {"n": 52, "theme": 1, "page": 19, "q": "¿Qué ventaja tiene grabar un programa de TV o entrevista según el manual?", "options": ["Que los alumnos pueden ser famosos en redes sociales.", "Que los alumnos se encargan de hacer la escaleta y planificación del tema.", "Que el profesor no tiene que trabajar ese día.", "Que se puede hacer sin necesidad de guion."], "correct": 1}, {"n": 53, "theme": 1, "page": 20, "q": "¿Cuál es la inversión material necesaria para la teatralización?", "options": ["Muy alta, por el vestuario.", "No requiere una inversión en materiales.", "Solo el coste de las entradas al teatro.", "Depende del presupuesto del centro educativo."], "correct": 1}, {"n": 54, "theme": 1, "page": 20, "q": "¿Qué deben investigar los alumnos antes de teatralizar una empresa?", "options": ["La biografía del fundador de la empresa.", "Las funciones, competencias y departamentos de cada cargo.", "Cómo vestir de forma elegante para el papel.", "El precio de las acciones en ese momento."], "correct": 1}, {"n": 55, "theme": 1, "page": 20, "q": "¿Cómo se divide la clase en la actividad de simulación de un gobierno?", "options": ["En dos grupos: ricos y pobres.", "En tres grupos: gobierno, comerciantes y consumidores.", "En un solo grupo donde todos son ministros.", "En grupos individuales por cada alumno."], "correct": 1}, {"n": 56, "theme": 1, "page": 21, "q": "¿En qué actividad se enseña el uso de las hojas de reclamaciones?", "options": ["En la visita a un banco.", "En la actividad de simulación de consumidores.", "En el examen de macroeconomía.", "En la creación de una cooperativa."], "correct": 1}, {"n": 57, "theme": 1, "page": 21, "q": "¿Qué lugares se recomiendan visitar en excursiones de Bachillerato?", "options": ["Un mercado de abastos únicamente.", "Entidades públicas de empleo o el Instituto Nacional de Estadística.", "Un parque de atracciones temático.", "El despacho del director del centro."], "correct": 1}, {"n": 58, "theme": 1, "page": 21, "q": "¿En quién se basa en parte la actividad de \"La cooperativa\"?", "options": ["En Adam Smith.", "En Freinet y su Escuela Moderna.", "En De Miguel Díaz.", "En Giner de los Ríos."], "correct": 1}, {"n": 59, "theme": 1, "page": 22, "q": "¿Por qué se considera \"delicada\" la actividad de la cooperativa escolar?", "options": ["Porque los alumnos pueden pelearse por los cargos.", "Porque se cuenta con dinero real que aportan los alumnos.", "Porque requiere permiso del Ministerio de Hacienda.", "Porque los alumnos no saben contar dinero."], "correct": 1}, {"n": 60, "theme": 1, "page": 22, "q": "¿Qué busca la metodología común en el \"aula de la experiencia\"?", "options": ["Que todos los alumnos cuenten lo mismo.", "Que haya un hilo conductor entre los casos personales.", "Evitar que los alumnos hablen de sus familias.", "Poner nota solo al que tenga la mejor experiencia."], "correct": 1}, {"n": 61, "theme": 1, "page": 23, "q": "¿Cuántos créditos ECTS tiene el Máster de la Universidad de Almería mencionado?", "options": ["60 créditos.", "15 créditos.", "6 créditos.", "8 créditos."], "correct": 2}, {"n": 62, "theme": 1, "page": 23, "q": "¿Cuál es el nombre del Máster de la Universidad de Nebrija?", "options": ["Máster en Formación del Profesorado Secundaria. Economía y ADE.", "Máster Universitario en Formación del Profesorado. Didáctica de la Economía.", "Máster en Profesorado de Educación Secundaria. Economía.", "Máster en Innovación Docente en Economía."], "correct": 1}, {"n": 63, "theme": 1, "page": 23, "q": "¿Quién organiza el Congreso Nacional sobre la enseñanza de la economía?", "options": ["La Universidad de Murcia.", "La Confederación Estatal de Asociaciones de Profesorado de Economía (CEAPES).", "El Ministerio de Educación.", "La Universidad de Valencia."], "correct": 1}, {"n": 64, "theme": 1, "page": 24, "q": "¿En qué año se preveía la celebración de la Paris Conference on Education mencionada?", "options": ["2020.", "2023.", "2025.", "1876."], "correct": 1}, {"n": 65, "theme": 1, "page": 24, "q": "¿Cuál es la dirección web de la asociación de profesores de MADRID?", "options": ["www.apacepv.org.", "www.adesmad.es/.", "www.aeee.cat.", "www.adesmur.es/."], "correct": 1}, {"n": 66, "theme": 1, "page": 35, "q": "¿Cuál es el objetivo principal de la evaluación del profesorado?", "options": ["Decidir despidos de forma rápida.", "Medir y evaluar el desempeño en su labor docente, investigadora y de servicio.", "Comparar a los profesores para ver quién es más simpático.", "Justificar la reducción de salarios."], "correct": 1}, {"n": 67, "theme": 1, "page": 35, "q": "¿Qué se evalúa en la \"planificación de lecciones\" del docente?", "options": ["La puntualidad al entrar en clase.", "La claridad, organización y relevancia de los objetivos de aprendizaje.", "El número de libros que tiene en su mesa.", "La marca del ordenador que utiliza."], "correct": 1}, {"n": 68, "theme": 1, "page": 36, "q": "¿Es habitual la evaluación del profesorado por parte de padres y madres?", "o on una exposición oral"], "correct": 0}, {"n": 10, "theme": 2, "page": 48, "q": "¿Se debe evaluar la accesibilidad del centro?", "options": ["No, no es necesario", "Sí, siempre", "Solo si incide en el rendimiento del alumnado", "Cuando así lo decida el claustro de profesores"], "correct": 1}, {"n": 11, "theme": 2, "page": 53, "q": "¿Cómo deben ser los objetivos de aprendizaje?", "options": ["claros, específicos, prácticos y medibles", "claros, específicos, medibles y realistas", "claros, genéricos, prácticos y realistas", "claros, genéricos, prácticos y variados"], "correct": 1}, {"n": 12, "theme": 2, "page": 9, "q": "¿Qué ley sustituyó a la Ley Reguladora de la Enseñanza?", "options": ["La Ley General de Educación", "La Ley Moyano", "La Ley Orgánica de Calidad Educativa", "La Ley Orgánica de Ordenación General del Sistema Educativo"], "correct": 0}, {"n": 13, "theme": 2, "page": 7, "q": "¿Con qué fin se realiza toda actividad económica?", "options": ["Con el fin de cubrir unas necesidades, ya sea a través de bienes de consumo o servicios.", "Con el fin de producir y distribuir bienes y servicios según ciertas normas.", "Con el fin de gestionar los recursos comunitarios.", "Con el fin de hacer que evolucione la sociedad."], "correct": 0}, {"n": 14, "theme": 2, "page": 52, "q": "¿Cuál de las siguientes actividades no contribuye especialmente al fomento del pensamiento crítico?", "options": ["Debates", "Resolución de problemas", "Análisis de casos", "Actividades grupales"], "correct": 3}, {"n": 16, "theme": 2, "page": 26, "q": "¿Cuántas materias de economía hay en 2º de Bachillerato de Ciencias Sociales?", "options": ["Dos", "Una", "Ninguna", "Tres"], "correct": 1}, {"n": 17, "theme": 2, "page": 9, "q": "¿Quién incorporó la economía en el plan de estudios de la Institución Libre de Enseñanza?", "options": ["Francisco Giner de los Ríos", "Valverde", "Claudio Moyano", "Valbuena"], "correct": 0}, {"n": 18, "theme": 2, "page": 32, "q": "¿A qué hacen referencia conceptos c const state = QUESTIONS.map((q,i)=>({id:i, order:shuffle([0,1,2,3]), selected:null, checked:false}));
const STATS_KEY='quiz_stats_v2';
function loadStats(){
 try{
  const raw=JSON.parse(localStorage.getItem(STATS_KEY)||'{}');
  return raw && typeof raw==='object' ? raw : {};
 }catch(e){return {}}
}
let stats=loadStats();
function saveStats(){try{localStorage.setItem(STATS_KEY,JSON.stringify(stats))}catch(e){}}
function recordAttempt(i){
 const q=QUESTIONS[i], st=state[i];
 if(st.selected===null) return;
 const k=String(q.n)+'|'+String(q.theme);
 if(!stats[k]) stats[k]={n:q.n,theme:q.theme,page:q.page,q:q.q,attempts:0,correct:0,wrong:0};
 stats[k].attempts++;
 if(st.selected===q.correct) stats[k].correct++; else stats[k].wrong++;
 saveStats();
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const quiz=document.getElementById('quiz'), theme=document.getElementById('theme'), search=document.getElementById('search'), count=document.getElementById('count'), summary=document.getElementById('summary');
function visibleIndices(){
 const t=theme.value, s=search.value.trim().toLowerCase();
 return QUESTIONS.map((q,i)=>({q,i})).filter(x=>(t==='all'||String(x.q.theme)===t)&&(!s||x.q.q.toLowerCase().includes(s)||x.q.options.some(o=>o.toLowerCase().includes(s)))).map(x=>x.i);
}
function render(){
 const ids=visibleIndices(); count.textContent=`Mostrando ${ids.length} de ${QUESTIONS.length} preguntas`;
 quiz.innerHTML='';
 ids.forEach(i=>{
  const q=QUESTIONS[i], st=state[i], card=document.createElement('section'); card.className='question';
  const opts=st.order.map((orig,pos)=>{
    const checked=st.selected===orig?'checked':'';
    let cls='option';
    if(st.checked && orig===q.correct) cls+=' correctOpt';
    if(st.checked && st.selected===orig && orig!==q.correct) cls+=' wrongOpt';
    return `<label class="${cls}"><input type="radio" name="q${i}" value="${orig}" ${checked}> <span><b>${String.fromCharCode(65+pos)})</b> ${esc(q.options[orig])}</span></label>`;
  }).join('');
  let fb='';
  if(st.checked){
    if(st.selected===null) fb='<span class="feedback bad">Sin responder.</span>';
    else if(st.selected===q.correct) fb='<span class="feedback good">✓ Correcta</span>';
    else fb=`<span class="feedback bad">✗ Incorrecta. Correcta: ${esc(q.options[q.correct])}</span>`;
  }
  card.innerHTML=`<div class="meta"><span>Tema ${q.theme}</span><span>Pregunta ${q.n}</span><span>Manual: pág. ${q.page}</span></div><div class="qtext">${esc(q.q)}</div>${opts}<div class="actions"><button type="button" data-check="${i}">Corregir esta pregunta</button>${fb}</div>`;
  quiz.appendChild(card);
 });
 summary.hidden=true;
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
quiz.addEventListener('change',e=>{if(e.target.matches('input[type=radio]')){const i=+e.target.name.slice(1);state[i].selected=+e.target.value;state[i].checked=false}});
quiz.addEventListener('click',e=>{
 const b=e.target.closest('[data-check]'); if(!b)return;
 const i=+b.dataset.check;
 if(!state[i].checked && state[i].selected!==null) recordAttempt(i);
 state[i].checked=true; render();
 document.querySelector(`[data-check="${i}"]`)?.closest('.question')?.scrollIntoView({block:'center'});
});
theme.addEventListener('change',render); search.addEventListener('input',render);
document.getElementById('shuffle').addEventListener('click',()=>{visibleIndices().forEach(i=>{state[i].order=shuffle([0,1,2,3]);state[i].checked=false});render()});
document.getElementById('correctAll').addEventListener('click',()=>{
 const ids=visibleIndices();
 ids.forEach(i=>{if(!state[i].checked && state[i].selected!==null) recordAttempt(i); state[i].checked=true});
 render();
 let answered=0,ok=0;
 ids.forEach(i=>{if(state[i].selected!==null){answered++;if(state[i].selected===QUESTIONS[i].correct)ok++}});
 summary.hidden=false;
 const wrong=answered-ok, pct=answered?Math.round(ok*1000/answered)/10:0;
 summary.textContent=`Resultado visible: ${ok} aciertos · ${wrong} fallos · ${answered} respondidas · ${ids.length-answered} sin responder · ${pct}% de acierto.`;
 window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('reset').addEventListener('click',()=>{state.forEach(s=>{s.order=shuffle([0,1,2,3]);s.selected=null;s.checked=false});summary.hidden=true;render()});
document.getElementById('dark').addEventListener('click',()=>{document.body.classList.toggle('dark');document.getElementById('dark').textContent=document.body.classList.contains('dark')?'Modo claro':'Modo oscuro'});

const statsPanel=document.getElementById('statsPanel'), statsSummary=document.getElementById('statsSummary'), statsList=document.getElementById('statsList');
function renderStats(){
 const rows=Object.values(stats).filter(x=>x.attempts>0);
 const attempts=rows.reduce((a,x)=>a+x.attempts,0), correct=rows.reduce((a,x)=>a+x.correct,0), wrong=rows.reduce((a,x)=>a+x.wrong,0);
 const pct=attempts?Math.round(correct*1000/attempts)/10:0;
 statsSummary.textContent=attempts?`Histórico: ${attempts} intentos · ${correct} aciertos · ${wrong} fallos · ${pct}% de acierto · ${rows.length} preguntas practicadas.`:'Todavía no hay intentos registrados.';
 if(!rows.length){statsList.innerHTML='';return}
 rows.sort((a,b)=>{
   const ra=a.wrong/a.attempts, rb=b.wrong/b.attempts;
   return rb-ra || b.wrong-a.wrong || b.attempts-a.attempts;
 });
 const top=rows.slice(0,25);
 statsList.innerHTML='<div class="qtext" style="font-size:1rem">Preguntas que más fallas</div>'+top.map((x,idx)=>{
   const er=Math.round(x.wrong*1000/x.attempts)/10;
   return `<div style="padding:10px 0;border-bottom:1px solid var(--border)"><b>${idx+1}. Tema ${x.theme} · Pregunta ${x.n}</b> — ${x.wrong} fallos / ${x.attempts} intentos (${er}% error)<br><span style="color:var(--muted)">${esc(x.q)} · Manual: pág. ${x.page}</span></div>`;
 }).join('');
}
document.getElementById('statsBtn').addEventListener('click',()=>{
 renderStats(); statsPanel.hidden=false; statsPanel.scrollIntoView({behavior:'smooth',block:'start'});
});
document.getElementById('closeStats').addEventListener('click',()=>{statsPanel.hidden=true});
document.getElementById('clearStats').addEventListener('click',()=>{
 if(confirm('¿Borrar todo el historial de aciertos y fallos?')){
   stats={}; saveStats(); renderStats();
 }
});

render();
</script>
